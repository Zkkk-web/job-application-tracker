{% extends "base.html" %}

{% block title %}Add Application — ApplyTrack{% endblock %}

{% block content %}

  <div class="card" style="max-width:500px; margin: 40px auto;">
    <h2>Add New Application</h2>
    <form method="POST">
      <label>Company Name</label>
      <input type="text" name="company" required>

      <label>Position</label>
      <input type="text" name="position" required>

      <label>Application Date</label>
      <input type="date" name="date" id="dateInput" required>

      <label>Status</label>
      <select name="status">
        <option>Pending</option>
        <option>Applied</option>
        <option>Written Test</option>
        <option>Interview</option>
        <option>Offer</option>
        <option>Rejected</option>
      </select>

      <button type="submit">Add Application</button>
      <a href="/dashboard" class="btn btn-danger" style="margin-left:10px;">Cancel</a>
    </form>
  </div>

{% endblock %}

{% block extra_scripts %}
<script>
// Pre-fill date if coming from calendar
const urlDate = new URLSearchParams(location.search).get('date');
if (urlDate) document.getElementById('dateInput').value = urlDate;
</script>
{% endblock %}
